<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo — Monte Verde</title>
<meta name="theme-color" content="#16110C">
<link rel="icon" href="assets/marca/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/marca/icono.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hito Monte Verde">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="Catálogo — Monte Verde">
<meta property="og:description" content="El catálogo de la colección para hojear en pantalla o descargar completo.">
<meta property="og:image" content="assets/marca/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="El catálogo de la colección para hojear en pantalla o descargar completo.">
<link rel="stylesheet" href="assets/css/app.css?v=41">
<style>
  body { overflow: hidden; background: #0b0906; }

  /* la página ocupa toda la pantalla; la interfaz va encima y se puede ocultar */
  /* pan-y deja el deslizamiento propio; pinch-zoom devuelve el acercamiento del sistema,
     que en paginas de texto escaneado es la unica forma de leer con poca vista */
  #hoja { position: fixed; inset: 0; display: grid; place-items: center;
          touch-action: pan-y pinch-zoom; overflow: hidden; }
  #hoja img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block;
              transition: opacity .18s ease; }
  #hoja.cargando img { opacity: .35; }
  #hoja .pendiente { color: var(--sand-500); font-size: 14px; text-align: center; padding: 30px; }

  .cromo { position: fixed; left: 0; right: 0; z-index: 10;
           transition: transform .28s ease, opacity .28s ease;
           background: var(--glass-bg); backdrop-filter: var(--glass-blur); }
  body.limpio .cromo { opacity: 0; pointer-events: none; }
  body.limpio #arriba { transform: translateY(-100%); }
  body.limpio #abajo { transform: translateY(100%); }

  #arriba { top: 0; height: var(--bar-h); display: flex; align-items: center; gap: 10px;
            padding: 0 var(--gutter); border-bottom: 1px solid var(--line); }
  #arriba .mark { font-family: var(--serif); font-weight: 700; color: var(--cream); font-size: 15px; }
  #arriba .mark em { color: var(--ochre); font-style: normal; }
  #arriba .spacer { flex: 1; }
  #bajar { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  /* en pantalla angosta queda sólo la flecha: el espacio es para la página */
  @media (max-width: 460px) { #bajar .txt { display: none; } #chipTotal { display: none; } }

  #abajo { bottom: 0; padding: 9px var(--gutter) calc(9px + env(safe-area-inset-bottom));
           border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  #abajo .btn { padding: 10px 14px; flex: none; }
  #abajo .centro { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
                   font-size: 13px; color: var(--sand-500); }
  #abajo input { width: 58px; text-align: center; background: var(--soil-mid); color: var(--cream);
                 border: 1px solid var(--line); border-radius: 9px; padding: 7px 4px;
                 font: 600 14px var(--sans); }

  /* zonas invisibles a los costados: pasar página sin tapar la hoja */
  .paso { position: fixed; top: var(--bar-h); bottom: 64px; width: 24%; z-index: 8;
          border: 0; background: none; cursor: pointer; color: transparent; font-size: 0; }
  .paso.izq { left: 0; } .paso.der { right: 0; }

  /* cajón de miniaturas */
  #cajon { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; max-height: 62vh;
           background: var(--glass-bg); backdrop-filter: var(--glass-blur);
           border-top: 1px solid var(--line);
           padding: 10px var(--gutter) calc(14px + env(safe-area-inset-bottom));
           transform: translateY(101%); transition: transform .3s cubic-bezier(.3,.8,.3,1);
           overflow: auto; }
  #cajon.abierto { transform: none; }
  #cajon h3 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  #cajon h3 button { margin-left: auto; padding: 6px 12px; }
  #rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  #rejilla figure { margin: 0; cursor: pointer; }
  #rejilla img { width: 100%; aspect-ratio: 1300 / 1182; object-fit: cover; object-position: top;
                 background: var(--soil-soft); border: 1px solid var(--line); border-radius: 7px;
                 display: block; }
  #rejilla figcaption { font-size: 10.5px; color: var(--sand-500); text-align: center; margin-top: 3px; }
  #rejilla .activa img { border-color: var(--ochre); }
  #rejilla .activa figcaption { color: var(--ochre-light); }
</style>
</head>
<body>

<div id="hoja"><img id="img" alt="" decoding="async"></div>

<button class="paso izq" id="prev" aria-label="Página anterior">anterior</button>
<button class="paso der" id="next" aria-label="Página siguiente">siguiente</button>

<header class="cromo topbar" id="arriba">
  <span class="mark">Monte <em>Verde</em></span>
  <span class="spacer"></span>
  <a class="chip" id="bajar" href="assets/catalogo/catalogo-monte-verde.pdf?v=41" download>
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg><span class="txt">Descargar PDF</span>
  </a>
  <span class="chip sage" id="chipTotal">—</span>
</header>

<div class="cromo" id="abajo">
  <button class="btn" id="prev2" aria-label="Anterior">‹</button>
  <div class="centro">
    <input id="salto" type="number" min="1" value="1" aria-label="Ir a la página">
    <span id="indicador">de —</span>
  </div>
  <button class="btn" id="verCajon">Índice</button>
  <button class="btn" id="next2" aria-label="Siguiente">›</button>
</div>

<div id="cajon">
  <h3>Todas las páginas <button class="btn" id="cerrarCajon">Cerrar</button></h3>
  <div id="rejilla"></div>
  <a class="btn" style="margin-top:12px" href="assets/catalogo/catalogo-monte-verde.pdf?v=41" download>
    Descargar el catálogo completo (PDF, 35 MB)</a>
  <p class="muted" style="font-size:11.5px;margin:8px 0 0">También está el botón de descarga arriba a la derecha.</p>
</div>

<script type="module">
import { montarVolver, origen } from './assets/js/navegacion.js?v=41';
import './assets/js/analitica.js?v=41';
import './assets/js/offline.js?v=41';

const $ = id => document.getElementById(id);
const DESDE = origen();
montarVolver(DESDE ? DESDE.url : 'index.html', DESDE ? 'Pieza' : 'Inicio');

const manifiesto = await fetch('assets/data/catalogo-paginas.json').then(r => r.json()).catch(() => null);
const PAGINAS = manifiesto?.paginas ?? [];
const TOTAL = PAGINAS.length;
// con la versión: las páginas se cachean un año y, si el catálogo cambia, tienen que
// llegar las nuevas aunque se llamen igual
const V = 41;
const pag = n => `assets/catalogo/paginas/p-${String(n).padStart(2, '0')}.webp?v=${V}`;
const thumb = n => `assets/catalogo/thumbs/p-${String(n).padStart(2, '0')}.webp?v=${V}`;

$('chipTotal').textContent = `${TOTAL} páginas`;
$('indicador').textContent = `de ${TOTAL}`;
$('salto').max = TOTAL;

const hoja = $('hoja'), img = $('img');

if (!TOTAL) {
  hoja.innerHTML = '<div class="pendiente">Las páginas para hojear todavía no están generadas.<br>' +
                   'Usa la descarga del PDF.</div>';
} else {
  const pedida = +new URLSearchParams(location.search).get('p') || PAGINAS[0];
  let i = PAGINAS.indexOf(pedida);
  if (i < 0) { const k = PAGINAS.findIndex(x => x >= pedida); i = k < 0 ? TOTAL - 1 : k; }

  const rejilla = $('rejilla');
  PAGINAS.forEach((num, k) => {
    const f = document.createElement('figure');
    f.innerHTML = `<img src="${thumb(num)}" loading="lazy" alt="Página ${num}">
                   <figcaption>${num}</figcaption>`;
    f.addEventListener('click', () => { ir(k); cerrar(); });
    rejilla.appendChild(f);
  });

  function ir(destino, empujar = true) {
    i = Math.min(TOTAL - 1, Math.max(0, destino));
    const n = PAGINAS[i];
    hoja.classList.add('cargando');
    img.src = pag(n);
    img.alt = `Página ${n} del catálogo de Monte Verde`;
    img.onload = () => hoja.classList.remove('cargando');
    $('salto').value = n;
    [...rejilla.children].forEach((f, k) => f.classList.toggle('activa', k === i));
    for (const k of [i + 1, i + 2, i - 1])
      if (k >= 0 && k < TOTAL) new Image().src = pag(PAGINAS[k]);
    if (empujar) history.replaceState(null, '', `?p=${n}${DESDE ? '&desde=' + DESDE.codigo : ''}`);
  }

  const mover = d => ir(i + d);
  $('prev').onclick = $('prev2').onclick = () => mover(-1);
  $('next').onclick = $('next2').onclick = () => mover(1);
  $('salto').addEventListener('change', e => {
    const k = PAGINAS.indexOf(+e.target.value);
    ir(k >= 0 ? k : Math.max(0, PAGINAS.findIndex(x => x >= +e.target.value)));
  });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') mover(-1);
    if (e.key === 'ArrowRight') mover(1);
    if (e.key === 'Escape') cerrar();
  });

  // deslizar para pasar página; un toque al centro esconde la interfaz
  let x0 = null, movido = false;
  hoja.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; movido = false; }, { passive: true });
  hoja.addEventListener('touchmove', e => {
    if (x0 != null && Math.abs(e.touches[0].clientX - x0) > 12) movido = true;
  }, { passive: true });
  hoja.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) mover(dx < 0 ? 1 : -1);
    else if (!movido) document.body.classList.toggle('limpio');
    x0 = null;
  });
  hoja.addEventListener('click', e => {
    if (e.target === img || e.target === hoja) document.body.classList.toggle('limpio');
  });

  const cajon = $('cajon');
  const cerrar = () => cajon.classList.remove('abierto');
  $('verCajon').addEventListener('click', () => cajon.classList.toggle('abierto'));
  $('cerrarCajon').addEventListener('click', cerrar);

  ir(i, false);
}
</script>
</body>
</html>
