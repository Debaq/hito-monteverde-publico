<style>
  body { overflow: hidden; }
  #vista { position: fixed; inset: 0; touch-action: none; cursor: grab; z-index: 0; }
  #vista:active { cursor: grabbing; }
  .topbar { position: fixed; left: 0; right: 0; top: 0; }
  #capa { position: fixed; inset: 0; pointer-events: none; z-index: 10;
          opacity: 1; transition: opacity .18s ease; }
  #capa.moviendo { opacity: 0; }
  .flag { position: absolute; transform: translate(-50%,-100%); display: flex;
          flex-direction: column; align-items: center; }
  .flag .txt { background: rgba(22,17,12,.86); border: 1px solid var(--glass-border);
               backdrop-filter: blur(10px); color: var(--cream); border-radius: var(--radius-pill);
               padding: 5px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .flag .line { width: 1px; height: 34px; background: var(--ochre); }
  .flag .dot { width: 9px; height: 9px; margin-top: -5px; border-radius: 50%;
               background: var(--ochre); box-shadow: 0 0 0 2px rgba(22,17,12,.9), 0 0 12px var(--ochre-glow); }
  #barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
           display: flex; gap: 10px; padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom));
           background: var(--glass-bg); backdrop-filter: var(--glass-blur);
           border-top: 1px solid var(--line); }
  #barra .btn { flex: 1; }
  #aviso { position: fixed; left: 50%; top: calc(var(--bar-h) + 14px); transform: translateX(-50%);
           z-index: 20; max-width: min(92vw, 440px); text-align: center; display: none; }
  #cargando { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center;
              background: var(--soil); transition: opacity .4s ease; }
  #cargando .txt { text-align: center; color: var(--sand-500); font-size: 13.5px; }
  #cargando .bar { width: 160px; height: 3px; background: var(--line); border-radius: 3px;
                   margin: 14px auto 0; overflow: hidden; }
  #cargando .bar i { display: block; height: 100%; width: 40%; background: var(--ochre);
                     animation: corre 1.1s infinite ease-in-out; }
  @keyframes corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
</style>
</head>
<body class="lienzo">

<canvas id="vista"></canvas>
<div id="capa"></div>

<header class="topbar">
  <a class="mark" href="index.html">Monte <em>Verde</em></a>
  <span class="spacer"></span>
  <span class="chip sage">Valle de Chinchihuapi</span>
</header>

<div class="card" id="aviso"></div>

<div id="barra">
  <button class="btn" id="btnGiro">Mover con el teléfono</button>
  <a class="btn" id="btnSalir" href="index.html">Volver</a>
</div>

<div id="cargando">
  <div class="txt">Cargando el sitio<div class="bar"><i></i></div></div>
</div>

<script type="importmap">
{"imports":{"three":"./assets/vendor/three/three.module.js"}}
</script>
<script type="module">
import { montarVolver, origen } from './assets/js/navegacion.js?v=41';
import './assets/js/analitica.js?v=41';
import './assets/js/offline.js?v=41';

// El 360 va en mitad del paseo: quien llega desde el visor (?volver=ar) sigue con la
// cámara apuntando a piezas, así que el botón de abajo lo devuelve ahí y no al inicio.
if (new URLSearchParams(location.search).get('volver') === 'ar') {
  const b = document.getElementById('btnSalir');
  b.href = 'ar.html';
  b.textContent = 'Volver a la experiencia 3D';
  b.classList.add('primary');
  montarVolver('ar.html', 'Experiencia 3D');
} else {
  const d = origen();
  montarVolver(d ? d.url : 'index.html', d ? 'Volver a la pieza' : 'Inicio');
}

import * as THREE from 'three';

// Parámetros fijados en debug/pano-debug.html
const CONFIG = {
  fovInicial: 23, fovMin: 23, fovMax: 45,
  pitchMin: -46, pitchMax: 7,
  yawInicial: 87.4, yawRango: 40,
  sensibilidad: 0.15, inercia: 0.88,
};
// caja del parche de foto real dentro del equirect de 7680x3840
const PARCHE = { x0: 3029, y0: 1762, x1: 4783, y1: 2902, W: 7680, H: 3840 };

const canvas = document.getElementById('vista');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.fovInicial, innerWidth / innerHeight, .1, 100);

// cielo sintético de fondo
const esfera = new THREE.SphereGeometry(10, 64, 48); esfera.scale(-1, 1, 1);
const matFondo = new THREE.MeshBasicMaterial();
scene.add(new THREE.Mesh(esfera, matFondo));

// foto real, encima y a resolución nativa
const g = new THREE.SphereGeometry(9.9, 96, 64,
  Math.PI * 2 * (PARCHE.x0 / PARCHE.W), Math.PI * 2 * ((PARCHE.x1 - PARCHE.x0) / PARCHE.W),
  Math.PI * (PARCHE.y0 / PARCHE.H), Math.PI * ((PARCHE.y1 - PARCHE.y0) / PARCHE.H));
g.scale(-1, 1, 1);
const matParche = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false });
scene.add(new THREE.Mesh(g, matParche));

const cargador = new THREE.TextureLoader();
const cargarTextura = (url, mat) => new Promise(ok => cargador.load(url, t => {
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  mat.map = t; mat.needsUpdate = true; ok(t);
}, undefined, () => ok(null)));

// en pantallas chicas alcanza la textura de 2K y baja a un cuarto el peso
const fondoUrl = innerWidth * Math.min(devicePixelRatio, 2) > 1400
  ? 'assets/pano/sitio-360-4k.webp' : 'assets/pano/sitio-360-2k.webp';

let yaw = CONFIG.yawInicial, pitch = -19.3, fov = CONFIG.fovInicial, vYaw = 0, vPitch = 0;
let arrastre = false, lastX = 0, lastY = 0, gyro = null, referencia = null;
// desde donde cuenta el sensor: se reajusta cada vez que el dedo suelta, para que el
// arrastre no se pierda apenas llega la siguiente lectura del giroscopio
let baseYaw = CONFIG.yawInicial, basePitch = -19.3;
const ZONA_MUERTA = .25;          // grados: por debajo de esto es ruido del sensor, no pulso
let escuchaGyro = null;

// al soltar, lo que quedo en pantalla pasa a ser el nuevo origen del sensor
const reanclar = () => {
  arrastre = false;
  if (!gyro) return;
  referencia = { a: gyro.a, b: gyro.b };
  baseYaw = yaw; basePitch = pitch;
};

const pos = e => e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
const abajo = e => { arrastre = true; const p = pos(e); lastX = p.x; lastY = p.y; vYaw = vPitch = 0; pedir(); };
const mover = e => {
  if (!arrastre) return;
  if (e.touches && e.touches.length > 1) return;   // dos dedos son pellizco, no paneo
  e.preventDefault();
  const p = pos(e);
  vYaw = -(p.x - lastX) * CONFIG.sensibilidad; vPitch = (p.y - lastY) * CONFIG.sensibilidad;
  yaw += vYaw; pitch += vPitch; lastX = p.x; lastY = p.y; pedir();
};
canvas.addEventListener('mousedown', abajo);
addEventListener('mousemove', mover);
addEventListener('mouseup', reanclar);
canvas.addEventListener('touchstart', abajo, { passive: true });
canvas.addEventListener('touchmove', mover, { passive: false });
canvas.addEventListener('touchend', reanclar);
canvas.addEventListener('touchcancel', reanclar);
canvas.addEventListener('wheel', e => { e.preventDefault(); fov += e.deltaY * .05; pedir(); }, { passive: false });

let pinza = null;
canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) { pinza = null; return; }
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  if (pinza) { fov *= pinza / d; pedir(); }
  pinza = d;
}, { passive: true });

// --- giroscopio (iOS pide permiso desde un gesto; ambos exigen HTTPS)
const aviso = document.getElementById('aviso');
const mostrarAviso = txt => { aviso.textContent = txt; aviso.style.display = 'block';
                              setTimeout(() => aviso.style.display = 'none', 5200); };
async function encenderSensor(btn, auto = false) {
  if (escuchaGyro) {
    removeEventListener('deviceorientation', escuchaGyro);   // sin esto la proxima lectura lo revivia
    escuchaGyro = null; gyro = null; referencia = null;
    if (btn) btn.textContent = 'Mover con el teléfono';
    return false;
  }
  if (!isSecureContext) {
    if (!auto) mostrarAviso('El giroscopio necesita una conexión segura (HTTPS).');
    return false;
  }
  try {
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted')
        return mostrarAviso('Sin permiso para usar el sensor de orientación.');
    }
    escuchaGyro = ev => {
      if (ev.alpha == null) return;
      // La brújula da rumbo absoluto: si se usa tal cual, el encuadre queda contra el tope
      // y sólo responde la inclinación. Se mide el movimiento desde donde estaba el teléfono
      // al activar el sensor, y se aplica sobre donde está mirando la vista.
      if (!referencia) { referencia = { a: ev.alpha, b: ev.beta ?? 0 }; baseYaw = yaw; basePitch = pitch; }
      gyro = { a: ev.alpha, b: ev.beta ?? 0 };
      pedir();
    };
    addEventListener('deviceorientation', escuchaGyro);
    referencia = null;                              // referencia nueva: se ancla en la proxima lectura
    if (btn) btn.textContent = 'Soltar el teléfono';
    setTimeout(() => {
      if (gyro) return;
      // encendido solo: si el aparato no tiene sensor, se vuelve al arrastre con el dedo
      // sin cartel de por medio; el visitante no pidió nada y no hay nada que explicarle
      if (auto) { encenderSensor(btn); return; }
      mostrarAviso('Este dispositivo no entrega datos de orientación.');
    }, 1200);
    return true;
  } catch (err) { mostrarAviso('No se pudo activar el giroscopio.'); return false; }
}

// El permiso de iOS exige un gesto, pero ese gesto ya lo da este boton: no hace falta
// un cartel a pantalla completa preguntando antes de dejar ver el valle. Se entra
// arrastrando con el dedo, que siempre funciona, y quien quiera el sensor lo pide aca.
document.getElementById('btnGiro').addEventListener('click', e => encenderSensor(e.currentTarget));

// en computador no hay sensor que ofrecer
const tactil = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
if (!tactil) document.getElementById('btnGiro').style.display = 'none';

// Entrar ya mirando alrededor con el teléfono, sin tocar nada: el 360 es eso y pedirlo
// con un botón sobra. En iOS no se puede, porque el permiso del sensor exige un gesto
// del usuario; ahí el botón sigue siendo la única vía y por eso no desaparece.
if (tactil && isSecureContext) {
  const btn = () => document.getElementById('btnGiro');
  if (typeof DeviceOrientationEvent?.requestPermission !== 'function') {
    addEventListener('load', () => encenderSensor(btn(), true));
  } else {
    // iPhone: el permiso sólo se concede desde un gesto, así que se aprovecha el primero
    // que haga el visitante sobre la escena. Sin esto tiene que descubrir el botón, y
    // el 360 es justo lo que se mira moviendo el teléfono.
    const alPrimerToque = () => {
      removeEventListener('touchend', alPrimerToque);
      if (!escuchaGyro) encenderSensor(btn(), true);
    };
    addEventListener('touchend', alPrimerToque, { once: true, passive: true });
  }
}

// --- banderitas ancladas al terreno
const capa = document.getElementById('capa');
const banderitas = [];
try {
  const r = await fetch('assets/data/banderitas.json');
  if (r.ok) for (const b of await r.json()) {
    const el = document.createElement('div');
    el.className = 'flag';
    el.innerHTML = '<div class="txt"></div><div class="line"></div><div class="dot"></div>';
    el.querySelector('.txt').textContent = b.texto;
    capa.appendChild(el);
    banderitas.push({ ...b, el });
  }
} catch { /* sin banderitas, el panorama funciona igual */ }

const dirDe = (y, p, destino) => {
  const ry = THREE.MathUtils.degToRad(y), rp = THREE.MathUtils.degToRad(p);
  return destino.set(-Math.sin(ry) * Math.cos(rp), Math.sin(rp), -Math.cos(ry) * Math.cos(rp));
};

// se reusan cuadro a cuadro en vez de crearlos de nuevo
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const _frente = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _proy = new THREE.Vector3();

// la vista se dibuja mientras algo la mueve; quieta y sin sensor, el bucle no hace nada
let sucio = true;
const pedir = () => { sucio = true; };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pedir();
});
dispatchEvent(new Event('resize'));

// centro de la foto real: es donde tiene que abrir, no en un borde
const centrar = () => {
  yaw = CONFIG.yawInicial;
  pitch = -19.3;
  vYaw = vPitch = 0;
  pedir();
};
centrar();

await Promise.all([
  cargarTextura(fondoUrl, matFondo),
  cargarTextura('assets/pano/parche-real.webp', matParche),
]);
const velo = document.getElementById('cargando');
velo.style.opacity = 0;
setTimeout(() => velo.remove(), 450);

let quieto = 0, ultimoT = 0;
renderer.setAnimationLoop(ahora => {
  // dt real: la inercia estaba atada al cuadro, asi que en una pantalla de 120 Hz el
  // paneo frenaba al doble de rapido que en una de 60
  const dt = ultimoT ? Math.min(.1, (ahora - ultimoT) / 1000) : 1 / 60;
  ultimoT = ahora;
  const k = dt * 60;                              // cuadros de 60 Hz equivalentes

  const enMovimiento = arrastre || Math.abs(vYaw) > .02 || Math.abs(vPitch) > .02 ||
                       (gyro && referencia);
  if (!sucio && !enMovimiento) return;            // nada que redibujar
  sucio = false;

  if (!arrastre) {
    yaw += vYaw * k; pitch += vPitch * k;
    const amortiguar = Math.pow(CONFIG.inercia, k);
    vYaw *= amortiguar; vPitch *= amortiguar;
  }

  // el fov máximo no es fijo: se recorta para que siempre quede recorrido lateral
  const MARGEN_MINIMO = 14;                       // grados de giro que hay que poder recorrer
  const hMax = CONFIG.yawRango - MARGEN_MINIMO;
  const fovTope = Math.min(CONFIG.fovMax, THREE.MathUtils.radToDeg(
    2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(hMax)) / camera.aspect)));
  fov = THREE.MathUtils.clamp(fov, CONFIG.fovMin, Math.max(CONFIG.fovMin, fovTope));

  const medioV = fov / 2;
  const medioH = THREE.MathUtils.radToDeg(
    Math.atan(Math.tan(THREE.MathUtils.degToRad(medioV)) * camera.aspect));
  const margen = Math.max(0, CONFIG.yawRango - medioH);
  yaw = THREE.MathUtils.clamp(yaw, CONFIG.yawInicial - margen, CONFIG.yawInicial + margen);
  pitch = THREE.MathUtils.clamp(pitch, CONFIG.pitchMin + medioV, CONFIG.pitchMax);

  if (gyro && referencia && !arrastre) {
    let dA = gyro.a - referencia.a;                 // cuánto giró desde que se activó
    while (dA > 180) dA -= 360;
    while (dA < -180) dA += 360;
    const dB = gyro.b - referencia.b;               // cuánto se inclinó
    // alpha crece al girar en sentido antihorario: por eso el signo va sumando
    const objYaw = THREE.MathUtils.clamp(baseYaw + dA,
                                CONFIG.yawInicial - margen, CONFIG.yawInicial + margen);
    const objPitch = THREE.MathUtils.clamp(basePitch + dB, CONFIG.pitchMin + medioV, CONFIG.pitchMax);

    // Filtrado adaptativo. La orientación llega con casi un grado de ruido aunque el
    // teléfono esté quieto en la mano, y aplicada tal cual la imagen tiembla. Filtrar
    // siempre con la misma fuerza no sirve: lo que quita el temblor deja el giro blando.
    // Así que el filtro se suelta según cuánto se movió de verdad.
    const salto = Math.max(Math.abs(objYaw - yaw), Math.abs(objPitch - pitch));
    if (salto > ZONA_MUERTA) {
      const base = Math.min(.45, Math.max(.05, (salto - ZONA_MUERTA) / 8));
      const f = 1 - Math.pow(1 - base, k);          // independiente de los Hz de la pantalla
      yaw += (objYaw - yaw) * f;
      pitch += (objPitch - pitch) * f;
    }
  }

  camera.fov = fov; camera.updateProjectionMatrix();
  camera.quaternion.setFromEuler(_euler.set(
    THREE.MathUtils.degToRad(pitch), THREE.MathUtils.degToRad(yaw), 0, 'YXZ'));
  renderer.render(scene, camera);

  // las banderitas se esconden mientras la vista se mueve
  const moviendo = arrastre || Math.abs(vYaw) > .02 || Math.abs(vPitch) > .02;
  quieto = moviendo ? 0 : quieto + dt;
  capa.classList.toggle('moviendo', moviendo || quieto < .18);
  if (!moviendo && quieto < .2) pedir();           // hay que llegar a pintarlas ya frenado

  _frente.set(0, 0, -1).applyQuaternion(camera.quaternion);
  for (const b of banderitas) {
    dirDe(b.yaw, b.pitch, _dir);
    if (_dir.dot(_frente) <= .05) { b.el.style.display = 'none'; continue; }
    _proy.copy(_dir).project(camera);
    b.el.style.display = '';
    b.el.style.left = ((_proy.x * .5 + .5) * innerWidth) + 'px';
    b.el.style.top = ((-_proy.y * .5 + .5) * innerHeight) + 'px';
  }
});
</script>
</body>
</html>
